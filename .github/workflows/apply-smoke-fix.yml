name: Apply hash-checked smoke fix (temporary)
on:
  push:
    branches: [fix/dependency-smoke-diagnostics]
    paths: [.github/workflows/apply-smoke-fix.yml]
permissions:
  contents: read
jobs:
  apply:
    if: github.repository == 'DrHepa/modly-lato2-extension'
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.9'
      - name: Apply exact source transform and check syntax
        run: |
          test "$GITHUB_REPOSITORY" = DrHepa/modly-lato2-extension
          test "$GITHUB_REF" = refs/heads/fix/dependency-smoke-diagnostics
          python .github/apply-smoke-source.py
          python -m compileall -q lato2_modly tools tests
      - name: Install offline test prerequisites
        run: >-
          python -m pip install --only-binary=:all:
          numpy==2.2.6 pillow==12.0.0 trimesh==4.10.1
          setuptools==80.9.0 wheel==0.45.1 packaging==25.0
      - name: Run full available regression suite
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Commit reviewed edits only to the fix branch
        run: |
          set -euo pipefail
          git diff --check
          test "$(git ls-remote origin refs/heads/fix/dependency-smoke-diagnostics | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- lato2_modly/dependencies.py lato2_modly/constants.py manifest.json
          git commit -m 'fix: honor conditional package markers and expose dependency probe failures'
          git push origin HEAD:refs/heads/fix/dependency-smoke-diagnostics
