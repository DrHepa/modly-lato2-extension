name: Compiler-free binary consumer
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: binary-consumer-${{ github.ref }}
  cancel-in-progress: true
jobs:
  consumer:
    name: ${{ matrix.os }} / ${{ matrix.python }} / ${{ matrix.torch }} / ${{ matrix.runtime }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: windows-2022, arch: x64, python: '3.11.9', torch: '2.6.0+cu124', runtime: standard}
          - {os: windows-2022, arch: x64, python: '3.12.10', torch: '2.6.0+cu124', runtime: standard}
          - {os: windows-2022, arch: x64, python: '3.11.9', torch: '2.9.1+cu128', runtime: standard}
          - {os: windows-2022, arch: x64, python: '3.12.10', torch: '2.9.1+cu128', runtime: standard}
          - {os: windows-2022, arch: x64, python: '3.11.9', torch: '2.6.0+cu124', runtime: modly-pbs}
          - {os: ubuntu-22.04, arch: x64, python: '3.11.9', torch: '2.6.0+cu124', runtime: standard}
          - {os: ubuntu-22.04, arch: x64, python: '3.12.10', torch: '2.6.0+cu124', runtime: standard}
          - {os: ubuntu-22.04, arch: x64, python: '3.11.9', torch: '2.9.1+cu128', runtime: standard}
          - {os: ubuntu-22.04, arch: x64, python: '3.12.10', torch: '2.9.1+cu128', runtime: standard}
          - {os: ubuntu-24.04-arm, arch: arm64, python: '3.11', torch: '2.6.0+cu126', runtime: standard}
          - {os: ubuntu-24.04-arm, arch: arm64, python: '3.12', torch: '2.6.0+cu126', runtime: standard}
          - {os: ubuntu-24.04-arm, arch: arm64, python: '3.11', torch: '2.9.1+cu128', runtime: standard}
          - {os: ubuntu-24.04-arm, arch: arm64, python: '3.12', torch: '2.9.1+cu128', runtime: standard}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
          architecture: ${{ matrix.arch }}
      - name: Binary provisioning unit tests
        run: python -m unittest discover -s tests -p 'test_binary_wheels.py' -v
      - name: Retrieve the exact Windows runtime pinned by Modly
        if: matrix.runtime == 'modly-pbs'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $archive = Join-Path $env:RUNNER_TEMP 'modly-python.tar.gz'
          $directory = Join-Path $env:RUNNER_TEMP 'modly-python'
          New-Item -ItemType Directory -Path $directory -Force | Out-Null
          Invoke-WebRequest -Uri 'https://github.com/indygreg/python-build-standalone/releases/download/20240726/cpython-3.11.9+20240726-x86_64-pc-windows-msvc-install_only.tar.gz' -OutFile $archive
          if ((Get-FileHash -Algorithm SHA256 $archive).Hash -ne 'F694BE48BDFEC1DACE6D69A19906B6083F4DD7C7C61F1138BA520E433E5598F8') { throw 'Standalone runtime digest mismatch' }
          tar -xzf $archive -C $directory
          if ($LASTEXITCODE -ne 0) { throw 'Runtime extraction failed' }
          "MODLY_ABI_PYTHON=$(Join-Path $directory 'python/python.exe')" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Install from published binary pack and verify offline reuse
        shell: python
        env:
          TORCH_BUILD: ${{ matrix.torch }}
        run: |
          import os, pathlib, subprocess, sys
          base = os.environ.get('MODLY_ABI_PYTHON', sys.executable)
          venv = pathlib.Path(os.environ['RUNNER_TEMP']).resolve() / 'binary-consumer'
          subprocess.run([base, '-m', 'venv', str(venv)], check=True)
          python = str(venv / ('Scripts/python.exe' if os.name == 'nt' else 'bin/python'))
          output = pathlib.Path('binary-evidence'); output.mkdir(exist_ok=True)
          def run(*args):
              result = subprocess.run([python, *args], capture_output=True, text=True, timeout=1200)
              with (output/'consumer.log').open('a', encoding='utf-8') as stream:
                  stream.write(result.stdout + result.stderr)
              if result.returncode:
                  print((result.stdout + result.stderr)[-18000:])
                  raise SystemExit(result.returncode)
          run('-m', 'pip', 'install', '--only-binary=:all:', 'pip==25.1.1', 'numpy==2.2.6')
          torch = os.environ['TORCH_BUILD']
          run('-m', 'pip', 'install', '--only-binary=:all:', 'torch==' + torch, '--index-url', 'https://download.pytorch.org/whl/' + torch.split('+')[1])
          run('tools/check_binary_install.py', '--torch', torch, '--report', str(output/'result.json'))
          print((output/'result.json').read_text())
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: binary-consumer-${{ matrix.os }}-${{ matrix.python }}-${{ matrix.torch }}-${{ matrix.runtime }}
          path: binary-evidence/
          retention-days: 7
          if-no-files-found: ignore
