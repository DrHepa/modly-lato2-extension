name: Publish initial verified operator binary pack
on:
  push:
    branches: [fix/prebuilt-portable-runtime]
    paths: [.github/workflows/publish-initial-binaries.yml]
permissions:
  contents: read
  actions: read
jobs:
  publish:
    if: github.repository == 'DrHepa/modly-lato2-extension'
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.9'
      - name: Install offline suite prerequisites
        run: >-
          python -m pip install --only-binary=:all:
          numpy==2.2.6 pillow==12.0.0 trimesh==4.10.1
          setuptools==80.9.0 wheel==0.45.1 packaging==25.0
      - name: Verify builds, test complete available suite and publish pack
        env:
          GH_TOKEN: ${{ github.token }}
        run: python .github/finish-binary-release.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: verified-complete-binary-pack
          path: release-pack/
          retention-days: 7
          if-no-files-found: error
