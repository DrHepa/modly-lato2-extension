name: Verify and apply reviewed ABI patch (temporary)

on:
  push:
    branches: [fix/windows-python-abi-20260910]
    paths: [.github/workflows/abi-hotfix-retry.yml]

permissions:
  contents: read

jobs:
  apply-reviewed-patch:
    if: github.repository == 'DrHepa/modly-lato2-extension'
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11.9'
          architecture: x64
      - name: Validate complete payload and original source hashes before any write
        shell: python
        run: |
          import ast, base64, hashlib, json, os, re, subprocess, zlib
          from pathlib import Path
          assert os.environ['GITHUB_REPOSITORY'] == 'DrHepa/modly-lato2-extension'
          assert os.environ['GITHUB_REF'] == 'refs/heads/fix/windows-python-abi-20260910'
          assert subprocess.check_output(['git','rev-parse','HEAD'], text=True).strip() == os.environ['GITHUB_SHA']
          source = Path('.github/workflows/abi-hotfix-bootstrap.yml').read_text()
          encoded = ''.join(re.search(r'encoded = """(.*?)"""', source, re.S)[1].split())
          repairs = {
              'K3GkzlGkzn6': 'K3Gkzn6',
              'FIXYKAKAKx': 'FIXYKAKx',
              'wdUsEf+WW7TR': 'wdUsEf+W7TR',
              'LQL+LUd7e7UJ': 'LQL+LUd7+UJ',
              'Ggafs6q382AN': 'Ggafs6q82AN',
              'a+Y3fyTn': 'a+Y3/yTn',
              '0f5WffPLS1': '0f5WPLS1',
          }
          for before, after in repairs.items():
              assert encoded.count(before) <= 1
              encoded = encoded.replace(before, after)
          assert len(encoded) == 12836, f'Unexpected payload length: {len(encoded)}'
          packed = base64.b64decode(encoded, validate=True)
          actual_payload_hash = hashlib.sha256(packed).hexdigest()
          assert actual_payload_hash == '754a5f82cbc47994e5c1d5481cac9af8993a40c878e4e40982e58593e1a74871', actual_payload_hash
          payload = json.loads(zlib.decompress(packed))
          allowed_modified = {'setup.py', 'lato2_modly/dependencies.py'}
          allowed_added = {'lato2_modly/python_abi.py', 'tests/_python_abi_fixtures.py', 'tests/test_python_abi_regression.py', 'tests/test_python_abi_integration.py', 'tools/check_python_abi.py', 'PYTHON_ABI_FIX.md'}
          assert {item['path'] for item in payload['modified']} == allowed_modified
          assert set(payload['added']) == allowed_added
          planned = {}
          for item in payload['modified']:
              path = Path(item['path'])
              assert not path.is_symlink()
              data = path.read_bytes()
              actual = hashlib.sha1(f'blob {len(data)}\0'.encode() + data).hexdigest()
              assert actual == item['base_git_blob'], f'Unreviewed source: {path} ({actual})'
              text = data.decode('utf-8')
              for edit in item['edits']:
                  assert text.count(edit['old']) == 1, f'Non-unique edit: {path}'
                  text = text.replace(edit['old'], edit['new'], 1)
              planned[item['path']] = text
          for name, content in payload['added'].items():
              assert not Path(name).exists(), f'Unexpected existing new file: {name}'
              planned[name] = content
          for name, content in planned.items():
              if name.endswith('.py'):
                  ast.parse(content, filename=name)
          for name, content in planned.items():
              path = Path(name)
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_bytes(content.encode('utf-8'))
          print('Applied exact hash-checked edits to:', ', '.join(sorted(planned)))
      - name: Regression and integration tests on real CPython 3.11.9
        run: python -m unittest discover -s tests -p "test_python_abi*.py" -v
      - name: Check actual Python and a fresh temporary venv
        run: python tools/check_python_abi.py --check-venv
      - name: Commit only reviewed production files to the fix branch
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test "$(git ls-remote origin refs/heads/fix/windows-python-abi-20260910 | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- setup.py lato2_modly/dependencies.py lato2_modly/python_abi.py tests/_python_abi_fixtures.py tests/test_python_abi_regression.py tests/test_python_abi_integration.py tools/check_python_abi.py PYTHON_ABI_FIX.md
          git commit -m 'fix(setup): recognize supported Windows Python without SOABI'
          git push origin HEAD:refs/heads/fix/windows-python-abi-20260910
