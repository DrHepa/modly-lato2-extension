          packed = base64.b64decode(''.join(encoded.split()), validate=True)
          assert hashlib.sha256(packed).hexdigest() == '754a5f82cbc47994e5c1d5481cac9af8993a40c878e4e40982e58593e1a74871', 'Damaged patch payload'
          payload = json.loads(zlib.decompress(packed))
          allowed_modified = {'setup.py', 'lato2_modly/dependencies.py'}
          allowed_added = {'lato2_modly/python_abi.py', 'tests/_python_abi_fixtures.py', 'tests/test_python_abi_regression.py', 'tests/test_python_abi_integration.py', 'tools/check_python_abi.py', 'PYTHON_ABI_FIX.md'}
          assert {item['path'] for item in payload['modified']} == allowed_modified
          assert set(payload['added']) == allowed_added
          planned = {}
          for item in payload['modified']:
              path = Path(item['path'])
              assert not path.is_symlink()
              data = path.read_bytes()
              actual = hashlib.sha1(f'blob {len(data)}\0'.encode() + data).hexdigest()
              assert actual == item['base_git_blob'], f'Unreviewed source: {path} ({actual})'
              text = data.decode('utf-8')
              for edit in item['edits']:
                  assert text.count(edit['old']) == 1, f'Non-unique edit: {path}'
                  text = text.replace(edit['old'], edit['new'], 1)
              planned[item['path']] = text
          for name, content in payload['added'].items():
              assert not Path(name).exists(), f'Unexpected existing new file: {name}'
              planned[name] = content
          for name, content in planned.items():
              if name.endswith('.py'):
                  ast.parse(content, filename=name)
          for name, content in planned.items():
              path = Path(name)
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_bytes(content.encode('utf-8'))
          print('Applied exact hash-checked edits to:', ', '.join(sorted(planned)))
      - name: Regression and integration tests on real CPython 3.11.9
        run: python -m unittest discover -s tests -p "test_python_abi*.py" -v
      - name: Check actual Python and a fresh temporary venv
        run: python tools/check_python_abi.py --check-venv
      - name: Commit only the reviewed files to this fix branch
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test "$(git ls-remote origin refs/heads/fix/windows-python-abi-20260910 | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- setup.py lato2_modly/dependencies.py lato2_modly/python_abi.py tests/_python_abi_fixtures.py tests/test_python_abi_regression.py tests/test_python_abi_integration.py tools/check_python_abi.py PYTHON_ABI_FIX.md
          git commit -m 'fix(setup): recognize supported Windows Python without SOABI'
          git push origin HEAD:refs/heads/fix/windows-python-abi-20260910
